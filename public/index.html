<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3fbf8;--card:#fff;--ink:#12332b;--mut:#6b8a82;--mint:#3ecfa0;--mint2:#d9f5ea;--warn:#e9a93a;--bad:#e5645f;--line:#dcece6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a17;--card:#14241f;--ink:#e3f5ee;--mut:#87a89e;--mint2:#1b3a30;--line:#23403a}}
:root[data-theme="dark"]{--bg:#0e1a17;--card:#14241f;--ink:#e3f5ee;--mut:#87a89e;--mint2:#1b3a30;--line:#23403a}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
aside{position:fixed;top:0;bottom:0;left:0;width:240px;background:var(--card);border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;z-index:20;transition:transform .25s;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:700;font-size:18px;margin:0 8px 16px;color:var(--mint)}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;color:var(--mut);display:flex;gap:10px;align-items:center}
aside button:hover{background:var(--mint2)}aside button.on{background:var(--mint2);color:var(--ink);font-weight:600}
main{margin-left:240px;padding:24px;max-width:980px}
.top{display:none}
.scrim{display:none}
@media(max-width:760px){aside{transform:translateX(-100%)}aside.open{transform:none}.scrim.open{display:block;position:fixed;inset:0;background:#0006;z-index:15}
main{margin:0;padding:16px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top button{all:unset;cursor:pointer;font-size:22px;padding:4px 8px}}
h2{margin:0 0 4px;font-size:22px}
.logo{display:flex;align-items:center;gap:10px}.logo .lg{width:32px;height:32px}
.nl{margin:14px 12px 4px;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.lg{display:block}.lg .ring,.lg .tr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s .1s ease forwards}
.lg .tr{animation-duration:.6s;animation-delay:.9s}
.lg .lf{transform-box:fill-box;transform-origin:0 100%;transform:scale(0);animation:gr .6s 1.3s cubic-bezier(.2,1.5,.4,1) forwards}
.lg .l2{transform-origin:100% 100%;animation-delay:1.5s}
@keyframes dr{to{stroke-dashoffset:0}}
.x{padding:8px 12px!important;font-size:16px;line-height:1}
.mdl{position:fixed;inset:0;background:#0007;z-index:200;display:grid;place-items:center;padding:20px}.mb{background:var(--card);color:var(--ink);border-radius:20px;padding:20px;max-width:340px;width:100%;box-shadow:0 20px 50px #0006}.mb p{color:var(--mut);margin:8px 0 12px}.mr{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.mr .btn{margin:0}.btn.dn{background:var(--bad);color:#fff}
aside{overflow-y:auto}aside .tg{margin-top:auto;border-top:1px solid var(--line);border-radius:0;padding-top:16px}
.sw{margin-left:auto;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:.25s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}.sw.on{background:var(--mint)}.sw.on::after{left:19px}
.gd8{text-align:center;padding:26px 18px}.gd8 .big{font-size:46px;display:inline-block;animation:float 3s ease-in-out infinite}.gd8 h2{margin:10px 0 6px}.gd8 ol{text-align:left;max-width:300px;margin:14px auto;padding-left:22px;color:var(--mut)}.gd8 li{margin-bottom:4px}
.pulse{animation:pls 1.8s infinite}@keyframes pls{0%{box-shadow:0 0 0 0 rgba(62,207,160,.6)}100%{box-shadow:0 0 0 14px rgba(62,207,160,0)}}
.sb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:16px;padding:12px 16px;margin-bottom:14px}.sb b{font-size:18px}
.ver{text-align:center;color:var(--mut);font-size:10px;opacity:.7;padding:2px 0 4px}
.s-good{background:#2fb872;color:#fff}.s-man{background:#f08c2e;color:#2b1500}.s-tight{background:#e5484d;color:#fff}.s-crit{background:#7a1212;color:#fff}
.rb{transform-box:fill-box;animation:sy .9s cubic-bezier(.2,.8,.2,1) both}
.gt{display:grid;grid-template-columns:90px 1fr;gap:2px 10px;align-items:center;margin-top:10px}.gt .gl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gt small{grid-column:2;color:var(--mut);font-size:11px}
.gb{height:12px;border-radius:8px;background:var(--mint2);position:relative;overflow:hidden}.gb i{position:absolute;top:0;bottom:0;border-radius:8px;transform-origin:left;animation:sx 1s .15s cubic-bezier(.2,.8,.2,1) both}.gd{background:#f08c2e}.gg{background:var(--mint)}
.card ul{margin:6px 0 10px;padding-left:20px}.card li{margin-bottom:4px}
.seg{animation:sg 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes sg{from{stroke-dasharray:0 100}}
.ln{stroke-dasharray:1;animation:ld 1.5s ease both}@keyframes ld{from{stroke-dashoffset:1}}
.dt{transform-box:fill-box;transform-origin:center;animation:pp .5s cubic-bezier(.3,1.6,.5,1) both}@keyframes pp{from{transform:scale(0)}}
.bar i{transform-origin:left;animation:sx 1s .15s cubic-bezier(.2,.8,.2,1) both}@keyframes sx{from{transform:scaleX(0)}}
.cols{display:flex;gap:14px;align-items:flex-end;height:170px;margin-top:14px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.col .pc{font-size:11px;font-weight:600;white-space:nowrap}
.col .tr{flex:1;width:100%;max-width:56px;background:var(--mint2);border-radius:12px;display:flex;align-items:flex-end;overflow:hidden}
.col i{display:block;width:100%;background:linear-gradient(180deg,#7cf0c9,var(--mint));border-radius:12px;transform-origin:bottom;animation:sy 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sy{from{transform:scaleY(0)}}
.col small{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(prefers-reduced-motion:reduce){.seg,.ln,.dt,.col i,.bar i{animation:none!important}}@keyframes gr{to{transform:scale(1)}}@keyframes fl{50%{transform:translateY(-5px)}}@keyframes fu{to{opacity:1;transform:none}}
.lg.st *,.lg.fl *{animation:none!important;stroke-dashoffset:0!important;transform:scale(1)!important}
.lg.fl{animation:fl 4s ease-in-out infinite}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tile{position:relative;overflow:hidden;border-radius:24px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;cursor:pointer;color:#06281e;box-shadow:0 10px 28px color-mix(in srgb,var(--mint) 28%,transparent);transition:transform .2s}
.tile:hover{transform:translateY(-3px)}.tile:active{transform:scale(.98)}
.tile::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:#fff;opacity:.22}
.t1{background:linear-gradient(135deg,#7eeacd,#2fc79a)}.t2{background:linear-gradient(135deg,#c6f6e6,#86e0c4)}
.tile .ti{font-size:34px;line-height:1}.tile b{font-size:19px;display:block}.tile small{opacity:.8;font-size:13px;display:block;padding-right:34px}.tile .ar{position:absolute;right:20px;bottom:18px;font-size:22px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad);color:#fff}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#c3f5e3,#3ecfa0 60%,#14b88a);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}.sp{text-align:center;color:#06281e}.sp .lg{width:120px;height:120px;margin:0 auto 18px;filter:drop-shadow(0 10px 20px #0003)}.sp .lg rect{fill:rgba(255,255,255,.22)}
.spt{font-size:40px;font-weight:800;letter-spacing:.18em;padding-left:.18em}.spt b{display:inline-block;opacity:0;transform:translateY(14px);animation:fu .5s forwards}
.sps{opacity:0;animation:fu .6s 2.1s forwards;letter-spacing:.22em;text-transform:uppercase;font-size:12px;margin-top:4px}
@media(prefers-reduced-motion:reduce){.lg *{animation:none!important;stroke-dashoffset:0!important;transform:scale(1)!important}.lg.fl,#splash *{animation:none!important;opacity:1!important;transform:none!important}}
.home{position:relative;overflow:hidden;min-height:calc(100vh - 80px);padding:4px;isolation:isolate}
.home .d1,.home .d2,.home .d3{position:absolute;z-index:-1;pointer-events:none}
.home .d1{width:300px;top:-60px;right:-80px;opacity:.22}
.home .d2{width:340px;bottom:-70px;left:-90px;opacity:.14;transform:rotate(-15deg)}
.home .d3{right:6%;bottom:12%;opacity:.25}
.hero{display:flex;gap:16px;align-items:center;margin:8px 0 22px}.hero .lg{width:76px;height:76px;flex:none}.hero h2{font-size:26px}.hero .sub{margin:0}
.home .card{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(6px)}p.sub{margin:0 0 18px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat small{color:var(--mut);display:block}.stat b{font-size:20px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--mint2);color:var(--ink)}
.ok{background:var(--mint);color:#06281e}.tight{background:var(--warn);color:#2b1c00}.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .g{flex:1;min-width:0}
.row small{color:var(--mut)}
input,select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{all:unset;cursor:pointer;background:var(--mint);color:#06281e;font-weight:600;padding:10px 16px;border-radius:12px;display:inline-block;margin-top:12px}
.btn.s{background:var(--mint2);color:var(--ink);padding:6px 12px;margin:0;font-size:13px;font-weight:500}
.x{all:unset;cursor:pointer;color:var(--mut);padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:99px;background:var(--mint2)}.chip.on{background:var(--mint);color:#06281e;font-weight:600}
.chart{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:9px;background:var(--mint2);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--mint)}
.alert{padding:10px 14px;border-radius:12px;background:var(--mint2);margin-bottom:8px}.alert.bad{background:var(--bad);color:#fff}
.tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.tip:last-child{border:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#14b88a"/></linearGradient></defs></svg><aside id="side"></aside><div id="toast"></div>
<div class="scrim" id="scrim" onclick="tg()"></div>
<main><div class="top"><button onclick="tg()">☰</button><b>ISIGO</b></div><div id="v"></div></main>
<script>
try{const t=localStorage.getItem("isigoTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}
const $=s=>document.querySelector(s);
const NAV=[['home','🏠','Home'],['Budget Tracker'],['budgets','🗂️','My Budgets'],['dash','📊','Dashboard'],['setup','⚙️','Budget Setup'],['bills','🧾','Bills'],['quick','⚡','Quick Spend'],['tips','💡','Tips'],['notif','🔔','Reminders'],['Planning'],['plan','🧭','Long-Term Goals'],['Savings'],['savings','🐷','Savings Tracker']];
let DB={act:null,list:[]},S=null,view='home',qcat='🍔 Food',hr='m',DRAFT=null;
const newB=n=>({id:Date.now(),name:n,created:Date.now(),cur:'₱',freq:'monthly',amt:0,d1:15,d2:30,bills:[],paid:{},spends:[],nOn:false,nDays:3});
try{const j=JSON.parse(localStorage.getItem('mint2')||'null');if(j)DB=j;else{const o=JSON.parse(localStorage.getItem('mint')||'null');if(o&&(o.amt||(o.bills&&o.bills.length))){const b=Object.assign(newB('My Budget'),o);DB={act:b.id,list:[b]}}}}catch(e){}
const save=()=>{try{localStorage.setItem('mint2',JSON.stringify(DB))}catch(e){}try{clearTimeout(window._ps);window._ps=setTimeout(syncPush,800)}catch(e){}};
DB.sav=DB.sav||[];DB.list=DB.list.filter(b=>b.amt>0||b.bills.length||b.spends.length);if(!DB.list.find(b=>b.id===DB.act))DB.act=DB.list[0]?DB.list[0].id:null;
const pick=()=>{S=DRAFT||DB.list.find(b=>b.id===DB.act)||null};pick();
const mk=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)};
const m=n=>S.cur+Math.round(n).toLocaleString();
const dueD=d=>{const n=new Date(),l=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return new Date(n.getFullYear(),n.getMonth(),Math.min(d,l))};
const left=d=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((dueD(d)-t)/864e5)};
const isPaid=b=>(S.paid[mk()]||[]).includes(b.id);
const curSp=()=>S.spends.filter(s=>s.k===mk());
function calc(){const inc=S.amt*(S.freq==='bimonthly'?2:1),bt=S.bills.reduce((a,b)=>a+b.amt,0),
 pd=S.bills.filter(isPaid).reduce((a,b)=>a+b.amt,0),sp=curSp().reduce((a,b)=>a+b.amt,0),lf=inc-bt-sp;
 const st=stat(lf,inc);
 return{inc,bt,pd,sp,lf,st}}
function sorted(){return[...S.bills].sort((a,b)=>(isPaid(a)-isPaid(b))||left(a.day)-left(b.day))}
function due(b){const l=left(b.day);return isPaid(b)?'Paid ✓':l<0?`Overdue ${-l}d`:l===0?'Due today':`In ${l} day${l>1?'s':''}`}
function tg(){$('#side').classList.toggle('open');$('#scrim').classList.toggle('open')}
function go(x){if(x!=='plan')CK=null;if(DRAFT&&x!=='setup'){DRAFT=null;pick()}view=x;$('#side').classList.remove('open');$('#scrim').classList.remove('open');render()}
function nav(){$('#side').innerHTML=`<div class="logo">${logo('st')}ISIGO</div>`+NAV.map(n=>n.length<3?`<small class="nl">${n[0]}</small>`:`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')+themeBtn()}
function donut(c){const tot=Math.max(c.inc,c.bt+c.sp,1),seg=[[c.bt,'var(--warn)'],[c.sp,'#7aa7f0'],[Math.max(c.lf,0),'var(--mint)']];let o=25,s='';
 seg.forEach(([v,col])=>{const p=v/tot*100;s+=`<circle class="seg" r="15.9" cx="21" cy="21" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"/>`;o-=p});
 const ring=c.lf<0?'<circle r="15.9" cx="21" cy="21" fill="none" stroke="var(--bad)" stroke-width="5"/>':'<circle r="15.9" cx="21" cy="21" fill="none" stroke="var(--mint2)" stroke-width="5"/>'+s;
 return`<svg width="170" height="170" viewBox="0 0 42 42">${ring}<text x="21" y="22" text-anchor="middle" font-size="4.2" fill="var(--ink)" font-weight="700">${m(c.lf)}</text><text x="21" y="27" text-anchor="middle" font-size="2.6" fill="var(--mut)">${c.lf<0?'over budget':'left'}</text></svg>`}
function cats(){const o={};S.bills.forEach(b=>o[b.cat]=(o[b.cat]||0)+b.amt);curSp().forEach(s=>o[s.cat]=(o[s.cat]||0)+s.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function tips(c){const t=[];if(c.inc<=0)return[['👋','Start in Budget Setup: enter your salary and pay schedule.']];
 const bp=c.bt/c.inc*100;
 if(c.lf<0)t.push(['🚨',`You are ${m(-c.lf)} over budget. Pause non-essential spending and review bills you can reduce or move.`]);
 else if(c.lf<c.inc*.2)t.push(['⚠️','Less than 20% of income is left. Try to hold extra spending until next payday.']);
 else t.push(['🌱',`Great — you have ${m(c.lf)} free. Consider putting at least half into savings.`]);
 if(bp>50)t.push(['🧾',`Bills take ${Math.round(bp)}% of income. Aim for under 50% — look for cheaper plans or subscriptions to cut.`]);
 const od=S.bills.filter(b=>!isPaid(b)&&left(b.day)<0);if(od.length)t.push(['⏰',`${od.length} overdue bill(s): ${od.map(b=>b.name).join(', ')}. Pay these first to avoid penalties.`]);
 const sp=c.sp/c.inc*100;if(sp>20)t.push(['⚡',`Quick spends are ${Math.round(sp)}% of income. Set a weekly fun-money limit.`]);
 t.push(['🛟','Rule of thumb: 50% needs, 30% wants, 20% savings. Build an emergency fund of 3 months of bills.']);
 if(S.freq==='bimonthly')t.push(['📅','Bi-monthly pay: pay big bills from the paycheck closest to their due date and keep a buffer from each.']);
 return t}
const logo=c=>`<svg class="lg ${c||''}" viewBox="0 0 96 96"><rect width="96" height="96" rx="26" fill="url(#lgG)"/><circle class="ring" pathLength="1" cx="48" cy="60" r="22" fill="none" stroke="#fff" stroke-width="5"/><path class="tr" pathLength="1" d="M48 38V28" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/><path class="tr" pathLength="1" d="M37 66L45 58L50 63L59 53" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="lf" d="M48 29C48 17 56 10 70 9C70 22 62 30 48 29Z" fill="#fff"/><path class="lf l2" d="M48 33C48 25 43 20 34 20C34 28 39 33 48 33Z" fill="#fff" opacity=".85"/></svg>`;
const DECO='<svg class="d1" viewBox="0 0 200 200" fill="none" stroke="var(--mint)"><circle cx="100" cy="100" r="95"/><circle cx="100" cy="100" r="70"/><circle cx="100" cy="100" r="45"/><circle cx="100" cy="100" r="20" fill="var(--mint)"/></svg><svg class="d2" viewBox="0 0 64 64"><path d="M32 4c18 6 28 22 24 42-22 5-40-6-44-24C14 12 22 6 32 4z" fill="var(--mint)"/><path d="M14 58C22 36 34 24 50 16" stroke="var(--bg)" stroke-width="2" fill="none"/></svg><svg class="d3" width="140" height="140"><defs><pattern id="dp" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="var(--mint)"/></pattern></defs><rect width="140" height="140" fill="url(#dp)"/></svg>';
function homeV(){const c=S?calc():null,G=DB.sav,I=G.map(gInfo),avg=G.length?G.reduce((a,g,k)=>a+Math.min(I[k].s/g.target,1),0)/G.length:0;
 return`<div class="home">${DECO}<div class="hero">${logo('fl')}<div><h2>ISIGO</h2><p class="sub">Budget Tracker · Plan. Pay. Save.</p></div></div>
 <p class="sub" style="margin-bottom:12px">What would you like to do?</p>
 <div class="tiles"><div class="tile t1" onclick="go('budgets')"><span class="ti">📊</span><div><b>Budget Tracker</b><small>${S?'Continue with “'+S.name+'” · '+(c.inc>0?'<span class="pill '+c.st[1]+'">'+c.st[0]+'</span>':'needs setup'):'Plan your salary, bills and spending'}</small></div><span class="ar">→</span></div>
 <div class="tile t2" onclick="go('savings')"><span class="ti">🐷</span><div><b>Savings Tracker</b><small>${G.length?G.length+' goal'+(G.length>1?'s':'')+' · '+Math.round(avg*100)+'% complete':'Set a goal and watch it grow'}</small></div><span class="ar">→</span></div></div></div>`}

function periods(){const inc=S.amt*(S.freq==='bimonthly'?2:1),now=new Date(),c0=new Date(S.created||Date.now()),all=[];
 if(hr==='m'){const cur=now.getFullYear()*12+now.getMonth();for(let t=c0.getFullYear()*12+c0.getMonth();t<=cur;t++){const yy=Math.floor(t/12),mm=t%12,key=yy+'-'+(mm+1);
  const bt=S.bills.filter(b=>{const d=new Date(b.id);return d.getFullYear()*12+d.getMonth()<=t}).reduce((a,b)=>a+b.amt,0);
  const sp=S.spends.filter(s=>s.k===key).reduce((a,b)=>a+b.amt,0);
  all.push({l:new Date(yy,mm,1).toLocaleString('default',{month:'short'}),v:inc-bt-sp})}return all.slice(-6)}
 const w=864e5*7,st=new Date(Math.min(c0,now));st.setHours(0,0,0,0);st.setDate(st.getDate()-st.getDay());
 const bt=S.bills.reduce((a,b)=>a+b.amt,0),al=(inc-bt)/4.345;
 for(let t=st.getTime();t<=now.getTime();t+=w){const sp=S.spends.filter(s=>s.id>=t&&s.id<t+w).reduce((a,b)=>a+b.amt,0);all.push({l:new Date(t).toLocaleDateString('default',{month:'short',day:'numeric'}),v:al-sp})}
 return all.slice(-8)}
function trend(){const P=periods(),n=P.length,vs=P.map(p=>p.v),mn=Math.min(0,...vs),mx=Math.max(0,...vs),rg=(mx-mn)||1,W=600,H=200,px=i=>n>1?40+i*(W-80)/(n-1):W/2,py=v=>20+(mx-v)/rg*(H-50);
 const line=n>1?`<polyline class="ln" pathLength="1" fill="none" stroke="var(--mint)" stroke-width="2.5" points="${P.map((p,i)=>px(i)+','+py(p.v)).join(' ')}"/>`:'';
 const dots=P.map((p,i)=>`<circle class="dt" style="animation-delay:${(.5+i*.15).toFixed(2)}s" cx="${px(i)}" cy="${py(p.v)}" r="5" fill="${p.v<0?'var(--bad)':'var(--mint)'}"/><text x="${px(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${p.l}</text>`).join('');
 return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Budget trend</b><span><button class="chip ${hr==='m'?'on':''}" onclick="hr='m';render()">Months</button> <button class="chip ${hr==='w'?'on':''}" onclick="hr='w';render()">Weeks</button></span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:8px"><line x1="10" x2="${W-10}" y1="${py(0)}" y2="${py(0)}" stroke="var(--mut)" stroke-dasharray="4 4"/><text x="12" y="${py(0)-4}" font-size="10" fill="var(--mut)">0</text>${line}${dots}</svg>${P.map(p=>`<div class="row"><div class="g">${p.l}</div><span class="pill ${p.v<0?'bad':'ok'}">${p.v<0?'Short '+m(-p.v):'Extra '+m(p.v)}</span></div>`).join('')}<p class="sub" style="margin:8px 0 0;font-size:13px">${hr==='m'?'Income minus bills and quick spends each month.':'Weekly room (income minus bills, spread over weeks) minus quick spends.'} History starts when this budget was created${n<2?', so more points appear as time passes':''}.</p></div>`}

if(view==='quick'){const P=['🍔 Food','🎉 Hangout','🚕 Transport','🎁 Gift','🆘 Emergency','🛒 Other'];
